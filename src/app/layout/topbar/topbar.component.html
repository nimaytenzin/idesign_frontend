<div class="topbar-container h-full px-6 flex items-center justify-between bg-white">
	<!-- Left Section: Menu Toggle -->
	<div class="topbar-left flex items-center gap-4">
		<button
			#menubutton
			class="menu-toggle-btn p-2 ml-3 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-teal-600 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-teal-600 focus:ring-offset-2"
			(click)="layoutService.onMenuToggle()"
			aria-label="Toggle menu"
			type="button"
		>
			<i class="pi pi-bars text-xl"></i>
		</button>

		<!-- Date and Time Display -->
		<div class="date-time-container flex items-center gap-2 px-4 py-2 bg-gray-50 rounded-lg border border-gray-200">
			<i class="pi pi-calendar text-gray-600"></i>
			<span class="text-sm font-medium text-gray-700 ">{{ currentDate | date: 'MMM dd, yyyy' }}</span>
			<span class="text-gray-400 mx-1">|</span>
			<i class="pi pi-clock text-gray-600"></i>
			<span class="text-sm font-medium text-gray-700 ">{{ currentTime }}</span>
		</div>
	</div>

	<!-- Right Section: User Actions -->
	<div class="topbar-right flex items-center gap-3">
		<!-- Notifications -->
		<button
			class="notification-btn p-2 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-teal-600 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-teal-600 focus:ring-offset-2 relative"
			aria-label="Notifications"
			type="button"
		>
			<i class="pi pi-bell text-xl"></i>
			<span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
		</button>

		<!-- User Profile -->
		<div class="user-profile flex items-center gap-3 cursor-pointer relative">
			<div class="user-info text-right hidden sm:block" (click)="toggleProfileMenu($event)">
				<p class="text-sm font-semibold text-gray-900 m-0 leading-tight  ">
					{{ currentUser?.name }}
				</p>
				<p class="text-xs text-gray-500 m-0 leading-tight  ">
					{{ currentUser?.role }}
				</p>
			</div>
			<p-avatar
				#profileMenuTrigger
				shape="circle"
				size="normal"
				class="ring-2 ring-gray-200 hover:ring-teal-600 transition-all duration-200 cursor-pointer"
				[image]="parseImageUrl(currentUser?.profileImageUrl || '')"
				styleClass="bg-teal-100 text-teal-700"
				(onClick)="toggleProfileMenu($event)"
			></p-avatar>
			<p-menu
				#profileMenu
				[model]="profileMenuItems"
				[popup]="true"
				[appendTo]="'body'"
				styleClass="w-64"
			></p-menu>
		</div>
	</div>
</div>

<!-- Toast and Confirm Popup -->
<p-toast></p-toast>
<p-confirmPopup></p-confirmPopup>
