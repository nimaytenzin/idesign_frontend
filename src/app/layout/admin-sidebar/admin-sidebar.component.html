<div class="sidebar-container h-full flex flex-col">
	<!-- Sidebar Header -->
	<div class="sidebar-header px-6 py-5 border-b border-gray-200 bg-white">
		<div class="flex items-center gap-3 mb-2">
			<div class=" flex items-center justify-center w-12 h-12 rounded-xl bg-white shadow-md overflow-hidden">
				<img
					[src]="logoUrl"
					alt="Company Logo"
					class="w-full h-full object-contain p-1"
				/>
			</div>
			<div class="flex-1 min-w-0">
				<h1 class="text-lg font-bold text-gray-900 m-0 truncate">
					{{ getCompanyName() }}
				</h1>
			</div>
		</div>
		<p class="text-xs font-medium text-gray-500 uppercase tracking-wider m-0 ">
			{{ getCompanySlogan() }}
		</p>
	</div>

	<!-- Navigation Menu -->
	<nav class="sidebar-nav flex-1 overflow-y-auto overflow-x-hidden px-4 py-4">
		<app-admin-menu></app-admin-menu>
	</nav>

	<!-- Sidebar Footer (Optional) -->
	<div class="sidebar-footer px-4 py-4 border-t border-gray-200 bg-gray-50">
		<div class="text-xs text-gray-500 text-center ">
			© 2024 iDesign. All rights reserved.
		</div>
	</div>
</div>
