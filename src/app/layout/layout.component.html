<div class="layout-wrapper min-h-screen bg-gray-50">
	<!-- Sidebar -->
	<aside
		class="layout-sidebar fixed left-0 top-0 h-screen w-72 bg-white border-r border-gray-200 z-50 transition-transform duration-300 ease-in-out shadow-lg"
		[ngClass]="{
			'-translate-x-full': (!layoutService.state.staticMenuMobileActive && layoutService.isMobile()) || (layoutService.state.staticMenuDesktopInactive && layoutService.isDesktop()),
			'translate-x-0': (layoutService.state.staticMenuMobileActive && layoutService.isMobile()) || (!layoutService.state.staticMenuDesktopInactive && layoutService.isDesktop())
		}"
	>
		<app-sidebar></app-sidebar>
	</aside>

	<!-- Main Content Area -->
	<div
		class="layout-main flex-1 transition-all duration-300 ease-in-out"
		[ngClass]="{
			'ml-0': layoutService.isMobile() || (layoutService.isDesktop() && layoutService.state.staticMenuDesktopInactive),
			'ml-72': layoutService.isDesktop() && !layoutService.state.staticMenuDesktopInactive
		}"
	>
		<!-- Topbar -->
		<header class="layout-topbar sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm">
			<app-topbar></app-topbar>
		</header>

		<!-- Page Content -->
		<main class="layout-content min-h-[calc(100vh-64px)] p-6 bg-gray-50">
			<router-outlet></router-outlet>
		</main>
	</div>

	<!-- Mobile Overlay -->
	<div
		class="layout-overlay fixed inset-0 bg-black bg-opacity-50 z-40 transition-opacity duration-300"
		[ngClass]="{
			'opacity-0 pointer-events-none': !layoutService.state.staticMenuMobileActive || layoutService.isDesktop(),
			'opacity-100': layoutService.state.staticMenuMobileActive && layoutService.isMobile()
		}"
		(click)="hideMenu()"
	></div>
</div>
