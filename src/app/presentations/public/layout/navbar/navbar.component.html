<!-- iDesign 3D Printing Shop Navbar -->
<nav
	class="fixed w-full z-[9998] top-0 left-0 transition-all duration-300 ease-in-out bg-white shadow-sm border-b border-slate-200"
	[class]="scrolled ? 'shadow-md border-slate-300' : 'shadow-sm border-slate-200'"
>
	<!-- Main Container -->
	<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
		<div class="flex items-center justify-between h-16">
			<!-- Logo and Brand Section -->
			<div
				class="flex items-center space-x-3 cursor-pointer group"
				(click)="navigateTo('/')"
			>
				<div class="relative">
					<!-- Company Logo -->
					<img 
						[src]="getLogoUrl()" 
						[alt]="company?.name || APPNAME" 
						class="h-16 object-contain"
					/>
				</div>
			</div>

			<!-- Desktop Navigation -->
			<div class="hidden md:flex items-center space-x-1">
				<a
					*ngFor="let item of navItems"
					(click)="navigateTo(item.route)"
					class="nav-link relative text-slate-600 hover:text-slate-900 px-4 py-2 text-sm font-medium transition-all duration-200 cursor-pointer group rounded-lg"
					[class.text-teal-600]="isActiveRoute(item.route)"
					[class.bg-teal-50]="isActiveRoute(item.route)"
				>
					<span class="relative z-10">{{ item.label }}</span>
					<!-- Active indicator -->
					<div
						class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-0 h-0.5 bg-teal-600 group-hover:w-full transition-all duration-300"
						[class.w-full]="isActiveRoute(item.route)"
					></div>
				</a>
			</div>

			<!-- Desktop Action Buttons -->
			<div class="hidden md:flex items-center space-x-3">
				<!-- Search Button -->
				<button
					class="p-2 text-slate-500 hover:text-slate-700 transition-colors duration-200 rounded-lg hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2"
					title="Search products"
					aria-label="Search products"
				>
					<i class="pi pi-search text-lg"></i>
				</button>

				<!-- Cart Button -->
				<button
					(click)="goToCheckout()"
					class="relative p-2 text-slate-500 hover:text-slate-700 transition-colors duration-200 rounded-lg hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2"
					[class.cart-icon-animated]="cartIconAnimated"
					title="Shopping cart"
					aria-label="Shopping cart"
					[disabled]="cartItemCount === 0"
				>
					<i class="pi pi-shopping-cart text-lg"></i>
					<!-- Cart badge -->
					<span
						*ngIf="cartItemCount > 0"
						class="absolute -top-1 -right-1 bg-teal-500 text-white text-xs rounded-full min-w-[20px] h-5 flex items-center justify-center font-semibold px-1.5"
						>{{ cartItemCount }}</span
					>
				</button>

				<!-- Login Button -->
				<button
					(click)="navigateTo('/auth/login')"
					class="px-4 py-2 border border-slate-300 text-slate-700 font-medium rounded-lg transition-all duration-200 hover:border-slate-400 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500"
				>
					<i class="pi pi-sign-in mr-2"></i>
					Login
				</button>

				<!-- Contact Button -->
				<button
					(click)="navigateTo('/contact')"
					class="px-4 py-2 bg-teal-500 text-white font-medium rounded-lg transition-all duration-200 hover:bg-teal-600 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500"
				>
					Get Quote
				</button>
			</div>

			<!-- Mobile Hamburger Button -->
			<div class="md:hidden">
				<button
					(click)="toggleMenu()"
					class="relative w-10 h-10 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-opacity-50 rounded-lg flex items-center justify-center transition-all duration-200 hover:bg-slate-50"
					[attr.aria-label]="isMenuOpen ? 'Close menu' : 'Open menu'"
				>
					<div class="w-6 h-6 relative">
						<span
							class="absolute block w-6 h-0.5 bg-slate-600 top-2 rounded-full transition-all duration-300"
							[class.rotate-45]="isMenuOpen"
							[class.top-3]="isMenuOpen"
						></span>
						<span
							class="absolute block w-6 h-0.5 bg-slate-600 top-3 rounded-full transition-all duration-300"
							[class.opacity-0]="isMenuOpen"
						></span>
						<span
							class="absolute block w-6 h-0.5 bg-slate-600 top-4 rounded-full transition-all duration-300"
							[class.-rotate-45]="isMenuOpen"
							[class.top-3]="isMenuOpen"
						></span>
					</div>
				</button>
			</div>
		</div>
	</div>

	<!-- Mobile Menu -->
	<div
		class="md:hidden transition-all duration-300 ease-in-out overflow-hidden bg-white border-t border-slate-200"
		[class.max-h-96]="isMenuOpen"
		[class.max-h-0]="!isMenuOpen"
	>
		<div class="px-4 py-4 space-y-2">
			<a
				*ngFor="let item of navItems"
				(click)="navigateTo(item.route)"
				class="block px-4 py-3 text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-lg cursor-pointer transition-all duration-200 font-medium"
				[class.bg-teal-50]="isActiveRoute(item.route)"
				[class.text-teal-600]="isActiveRoute(item.route)"
			>
				{{ item.label }}
			</a>

			<!-- Mobile Action Buttons -->
			<div class="pt-4 border-t border-slate-200 space-y-2">
				<button
					class="w-full text-left px-4 py-3 text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-lg transition-all duration-200 font-medium"
				>
					<i class="pi pi-search mr-3"></i>Search Products
				</button>
				<button
					(click)="goToCheckout()"
					class="w-full text-left px-4 py-3 text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-lg transition-all duration-200 font-medium"
					[disabled]="cartItemCount === 0"
				>
					<i class="pi pi-shopping-cart mr-3"></i>Shopping Cart ({{ cartItemCount }})
				</button>
				<button
					(click)="navigateTo('/auth/login')"
					class="w-full text-left px-4 py-3 text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-lg transition-all duration-200 font-medium"
				>
					<i class="pi pi-sign-in mr-3"></i>Login
				</button>
				<button
					(click)="navigateTo('/contact')"
					class="w-full mt-2 px-4 py-3 bg-teal-500 text-white font-medium rounded-lg hover:bg-teal-600 transition-all duration-200"
				>
					Get Quote
				</button>
			</div>
		</div>
	</div>
</nav>

<!-- Spacer for fixed navbar - matches navbar height exactly -->
<div class="h-16 w-full" id="navbar-spacer"></div>

<!-- Mobile: Floating Cart Button - visible when cart has items -->
<button
	*ngIf="cartItemCount > 0"
	(click)="goToCheckout()"
	class="floating-cart-fab md:hidden"
	[class.floating-cart-animated]="cartIconAnimated"
	title="View cart"
	[attr.aria-label]="'View shopping cart (' + cartItemCount + ' items)'"
>
	<i class="pi pi-shopping-cart text-xl"></i>
	<span
		class="floating-cart-badge"
		aria-hidden="true"
		>{{ cartItemCount }}</span
	>
</button>
