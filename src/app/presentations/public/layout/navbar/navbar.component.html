<!-- iDesign 3D Printing Shop Navbar -->
<nav
	class="fixed w-full z-[9998] top-0 left-0 transition-all duration-300 ease-in-out bg-white shadow-sm border-b border-gray-100"
	[class]="scrolled ? 'shadow-md border-gray-200' : 'shadow-sm border-gray-100'"
>
	<!-- Main Container -->
	<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
		<div class="flex items-center justify-between h-16">
			<!-- Logo and Brand Section -->
			<div
				class="flex items-center space-x-3 cursor-pointer group"
				(click)="navigateTo('/')"
			>
				<div class="relative">
					<!-- Geometric cube logo placeholder -->
					<img src="logo.png" alt="" class="h-16" />
				</div>
			</div>

			<!-- Desktop Navigation -->
			<div class="hidden md:flex items-center space-x-1">
				<a
					*ngFor="let item of navItems"
					(click)="navigateTo(item.route)"
					class="nav-link relative text-gray-600 hover:text-gray-900 px-4 py-2 text-sm font-medium transition-all duration-200 cursor-pointer group rounded-md"
					[class.active]="isActiveRoute(item.route)"
				>
					<span class="relative z-10 font-['Roboto']">{{ item.label }}</span>
					<!-- Active indicator -->
					<div
						class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-0 h-0.5 bg-teal-600 group-hover:w-full transition-all duration-300"
						[class.w-full]="isActiveRoute(item.route)"
					></div>
				</a>
			</div>

			<!-- Desktop Action Buttons -->
			<div class="hidden md:flex items-center space-x-3">
				<!-- Search Button -->
				<button
					class="p-2 text-gray-500 hover:text-gray-700 transition-colors duration-200 rounded-md hover:bg-gray-50"
					title="Search products"
				>
					<i class="pi pi-search text-lg"></i>
				</button>

				<!-- Cart Button -->
				<button
					class="relative p-2 text-gray-500 hover:text-gray-700 transition-colors duration-200 rounded-md hover:bg-gray-50"
					title="Shopping cart"
				>
					<i class="pi pi-shopping-cart text-lg"></i>
					<!-- Cart badge placeholder -->
					<span
						class="absolute -top-1 -right-1 bg-teal-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold"
						>3</span
					>
				</button>

				<!-- Login Button -->
				<button
					(click)="navigateTo('/auth/login')"
					class="px-4 py-2 border border-gray-300 text-gray-700 font-medium rounded-md transition-all duration-200 hover:border-gray-400 hover:bg-gray-50 font-['Poppins']"
				>
					<i class="pi pi-sign-in mr-2"></i>
					Login
				</button>

				<!-- Contact Button -->
				<button
					(click)="navigateTo('/contact')"
					class="px-4 py-2 bg-teal-600 text-white font-medium rounded-md transition-all duration-200 hover:bg-teal-700 hover:shadow-md transform hover:-translate-y-0.5 font-['Poppins']"
				>
					Get Quote
				</button>
			</div>

			<!-- Mobile Hamburger Button -->
			<div class="md:hidden">
				<button
					(click)="toggleMenu()"
					class="relative w-10 h-10 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-opacity-50 rounded-md flex items-center justify-center transition-all duration-200 hover:bg-gray-50"
					[attr.aria-label]="isMenuOpen ? 'Close menu' : 'Open menu'"
				>
					<div class="w-6 h-6 relative">
						<span
							class="absolute block w-6 h-0.5 bg-gray-600 top-2 rounded-full transition-all duration-300"
							[class.rotate-45]="isMenuOpen"
							[class.top-3]="isMenuOpen"
						></span>
						<span
							class="absolute block w-6 h-0.5 bg-gray-600 top-3 rounded-full transition-all duration-300"
							[class.opacity-0]="isMenuOpen"
						></span>
						<span
							class="absolute block w-6 h-0.5 bg-gray-600 top-4 rounded-full transition-all duration-300"
							[class.-rotate-45]="isMenuOpen"
							[class.top-3]="isMenuOpen"
						></span>
					</div>
				</button>
			</div>
		</div>
	</div>

	<!-- Mobile Menu -->
	<div
		class="md:hidden transition-all duration-300 ease-in-out overflow-hidden bg-white border-t border-gray-100"
		[class.max-h-96]="isMenuOpen"
		[class.max-h-0]="!isMenuOpen"
	>
		<div class="px-4 py-4 space-y-2">
			<a
				*ngFor="let item of navItems"
				(click)="navigateTo(item.route)"
				class="block px-4 py-3 text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-md cursor-pointer transition-all duration-200 font-['Roboto'] font-medium"
				[class.bg-teal-50]="isActiveRoute(item.route)"
				[class.text-teal-600]="isActiveRoute(item.route)"
			>
				{{ item.label }}
			</a>

			<!-- Mobile Action Buttons -->
			<div class="pt-4 border-t border-gray-100 space-y-2">
				<button
					class="w-full text-left px-4 py-3 text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-md transition-all duration-200 font-['Roboto'] font-medium"
				>
					<i class="pi pi-search mr-3"></i>Search Products
				</button>
				<button
					class="w-full text-left px-4 py-3 text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-md transition-all duration-200 font-['Roboto'] font-medium"
				>
					<i class="pi pi-shopping-cart mr-3"></i>Shopping Cart (3)
				</button>
				<button
					(click)="navigateTo('/auth/login')"
					class="w-full text-left px-4 py-3 text-gray-600 hover:text-gray-900 hover:bg-gray-50 rounded-md transition-all duration-200 font-['Roboto'] font-medium"
				>
					<i class="pi pi-sign-in mr-3"></i>Login
				</button>
				<button
					(click)="navigateTo('/contact')"
					class="w-full mt-2 px-4 py-3 bg-teal-600 text-white font-medium rounded-md hover:bg-teal-700 transition-all duration-200 font-['Poppins']"
				>
					Get Quote
				</button>
			</div>
		</div>
	</div>
</nav>

<!-- Spacer for fixed navbar -->
<div class="h-16" id="navbar-spacer"></div>
