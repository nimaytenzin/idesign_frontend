<div class="min-h-screen bg-slate-50 py-12">
	<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
		<div class="text-center mb-8">
			<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-amber-100 text-amber-600 mb-4">
				<i class="pi pi-times text-3xl"></i>
			</div>
			<h1 class="text-3xl font-bold text-slate-900 mb-2">
				Order Cancelled
			</h1>
			<p class="text-slate-600">
				Your order has been cancelled. No payment was charged.
			</p>
		</div>

		<div class="bg-white rounded-lg border border-slate-200 p-8 mb-8">
			<div class="space-y-4">
				<div *ngIf="orderNumber || orderId" class="flex justify-between items-center pb-4 border-b border-slate-200">
					<span class="text-slate-600">Cancelled order:</span>
					<span class="text-lg font-semibold text-slate-900">{{ orderNumber || (orderId ? '#' + orderId : 'N/A') }}</span>
				</div>
				<p class="text-slate-600 text-sm">
					If you change your mind, you can place a new order anytime.
				</p>
			</div>
		</div>

		<div class="flex flex-col sm:flex-row gap-4 justify-center">
			<button
				type="button"
				pButton
				label="Continue Shopping"
				icon="pi pi-shopping-bag"
				class="p-button-outlined"
				(click)="goToProducts()"
			></button>
			<button
				type="button"
				pButton
				label="Go to Home"
				icon="pi pi-home"
				class="p-button-outlined"
				(click)="goToHome()"
			></button>
		</div>
	</div>
</div>
