<!-- About Us Page -->
<div class="min-h-screen bg-slate-50">
	<!-- Page Header -->
	<section class="bg-white border-b border-slate-200">
		<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
			<div class="text-center">
				<h1 class="text-4xl font-bold text-slate-900 mb-4 tracking-tight">
					About Us
				</h1>
				<p class="text-lg text-slate-600 max-w-3xl mx-auto leading-relaxed">
					Meet our talented team of professionals dedicated to delivering excellence
				</p>
			</div>
		</div>
	</section>

	<!-- Staff Section -->
	<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
		<!-- Loading State -->
		<div *ngIf="loading" class="flex justify-center items-center py-20">
			<p-progressSpinner [style]="{ width: '50px', height: '50px' }"></p-progressSpinner>
		</div>

		<!-- Empty State -->
		<div *ngIf="!loading && staffList.length === 0" class="text-center py-20">
			<div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-slate-100 mb-6">
				<i class="pi pi-users text-4xl text-slate-400"></i>
			</div>
			<p class="text-xl text-slate-600 font-medium">No staff information available at this time.</p>
		</div>

		<!-- Staff Grid -->
		<div *ngIf="!loading && staffList.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
			<div
				*ngFor="let staff of staffList; let i = index"
				class="bg-white rounded-lg border border-slate-200 shadow-sm hover:shadow-md transition-all duration-200 overflow-hidden"
			>
				<!-- Staff Card Content -->
				<div class="p-6">
					<!-- Profile Picture -->
					<div class="flex justify-center mb-4">
						<div class="relative">
							<img
								*ngIf="staff.profileImageUrl"
								[src]="getProfileImageUrl(staff)"
								[alt]="staff.name"
								class="w-32 h-32 rounded-full object-cover border-4 border-slate-100 shadow-md"
 							/>
							<div
								*ngIf="!staff.profileImageUrl"
								class="w-32 h-32 rounded-full bg-gradient-to-br from-teal-400 to-teal-600 flex items-center justify-center border-4 border-slate-100 shadow-md"
							>
								<i class="pi pi-user text-white text-5xl"></i>
							</div>
						</div>
					</div>

					<!-- Staff Info -->
					<div class="text-center mb-4">
						<h3 class="text-xl font-semibold text-slate-900 mb-1">{{ staff.name }}</h3>
						<p class="text-sm font-medium text-teal-600 mb-1">{{ staff.employeeProfile?.position }}</p>
						<p class="text-xs text-slate-500 uppercase tracking-wide font-medium">{{ staff.employeeProfile?.department }}</p>
					</div>

					<!-- Bio Section -->
					<div class="mt-4 pt-4 border-t border-slate-200">
						<p class="text-sm text-slate-700 leading-relaxed text-center">
							{{ staff.employeeProfile?.bio || 'No bio available.' }}
						</p>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<p-toast></p-toast>
