<!-- Company Clients Marquee Section -->
<section class="py-12 bg-gray-50 overflow-hidden">
	<div class="max-w-7xl flex items-center gap-6 mx-auto px-4 sm:px-6 lg:px-8">
         
		<!-- Section Header -->
		<div class="text-center  ">
			<h2 class="text-2xl  font-bold text-gray-900 mb-2">
				Our Trusted Clients
			</h2>
			<p class="text-gray-600 max-w-2xl mx-auto">
				We're proud to work with these amazing companies
			</p>
		</div>

		<!-- Loading State -->
		<div *ngIf="loading" class="text-center py-12">
			<div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-teal-600"></div>
			<p class="mt-4 text-gray-600">Loading clients...</p>
		</div>

		<!-- Error State -->
		<div *ngIf="error && !loading" class="text-center py-12">
			<p class="text-red-600">{{ error }}</p>
		</div>

        <p-divider layout="vertical" [style]="{ height: '100px' }" class="h-full"></p-divider>

		<!-- Marquee Container -->
		<div *ngIf="!loading && !error && clients.length > 0" >
			<div class="flex gap-4">
				<div class="flex flex-col  items-center justify-center" *ngFor="let client of clients">
					<!-- Fixed height container for logo -->
					<div class="h-24 w-24 flex items-center justify-center mb-2">
						<img
							[src]="getLogoUrl(client.logo)"
							[alt]="client.name + ' logo'"
							class="max-w-full max-h-full object-contain"
							(error)="onImageError($event)"
						/>
					</div>
					<p class="text-xs text-center">{{ client.name }}</p>
				</div>
			</div>
		</div>

		<!-- Empty State -->
		<div *ngIf="!loading && !error && clients.length === 0" class="text-center py-12">
			<p class="text-gray-600">No clients available at the moment.</p>
		</div>
	</div>
</section>
