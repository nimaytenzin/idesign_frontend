<div class="hero-slider relative" *ngIf="!loading && slides.length > 0">
	<div class="slider-container relative overflow-hidden rounded-lg">
		<div
			*ngFor="let slide of slides; let i = index"
			class="slide absolute inset-0 transition-opacity duration-500"
			[class.opacity-100]="i === currentSlideIndex"
			[class.opacity-0]="i !== currentSlideIndex"
			[class.z-10]="i === currentSlideIndex"
		>
			<img
				[src]="getImageUrl(slide.imageUri)"
				[alt]="slide.title"
				class="slide-image w-full h-full object-cover"
				onerror="this.src='/assets/images/no-image.png'"
			/>
			<div class="slide-content absolute inset-0 flex flex-col items-center justify-center bg-black/40 text-white p-8">
				<div class="max-w-4xl text-center">
					<h2 class="text-4xl md:text-6xl font-bold mb-4">{{ slide.title }}</h2>
					<p *ngIf="slide.description" class="text-lg md:text-xl mb-6">
						{{ slide.description }}
					</p>
					<a
						*ngIf="slide.ctaText && slide.ctaLink"
						[href]="slide.ctaLink"
						class="inline-block px-8 py-3 bg-teal-600 text-white rounded-md hover:bg-teal-700 transition-all duration-200 font-semibold transform hover:-translate-y-1 hover:shadow-lg"
					>
						{{ slide.ctaText }}
					</a>
				</div>
			</div>
		</div>
	</div>

	<!-- Navigation Arrows -->
	<button
		*ngIf="slides.length > 1"
		class="slider-nav prev absolute left-4 top-1/2 -translate-y-1/2 z-20 bg-white/80 hover:bg-white text-gray-800 rounded-full w-12 h-12 flex items-center justify-center transition-all duration-200 shadow-lg"
		(click)="previousSlide()"
		aria-label="Previous slide"
	>
		<i class="pi pi-chevron-left"></i>
	</button>
	<button
		*ngIf="slides.length > 1"
		class="slider-nav next absolute right-4 top-1/2 -translate-y-1/2 z-20 bg-white/80 hover:bg-white text-gray-800 rounded-full w-12 h-12 flex items-center justify-center transition-all duration-200 shadow-lg"
		(click)="nextSlide()"
		aria-label="Next slide"
	>
		<i class="pi pi-chevron-right"></i>
	</button>

	<!-- Dots Indicator -->
	<div
		*ngIf="slides.length > 1"
		class="slider-dots absolute bottom-4 left-1/2 -translate-x-1/2 z-20 flex gap-2"
	>
		
	</div>
</div>

<div *ngIf="loading" class="flex justify-center items-center h-96">
	<div class="text-center">
		<p class="text-gray-500">Loading hero slides...</p>
	</div>
</div>
