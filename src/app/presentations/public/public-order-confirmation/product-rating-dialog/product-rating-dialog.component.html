<p-toast></p-toast>

<p-dialog
	[(visible)]="visible"
	[modal]="true"
	[style]="{ width: '90vw', maxWidth: '800px' }"
	[closable]="true"
	[draggable]="false"
	[resizable]="false"
	header="Rate Your Products"
	(close)="closeDialog()"
	(onHide)="closeDialog()"
>
	<div class="dialog-content">
		<p class="text-gray-600 mb-6">
			We'd love to hear your feedback! Please rate the products from your order.
		</p>

		<div class="space-y-6" *ngIf="productRatings.length > 0">
			<div
				*ngFor="let productRating of productRatings"
				class="product-rating-item border border-gray-200 rounded-lg p-4"
			>
				<div class="flex flex-col md:flex-row gap-4">
					<!-- Product Image -->
					<div class="flex-shrink-0">
						<img
							[src]="getProductImage(productRating.product)"
							[alt]="productRating.product?.title || 'Product'"
							class="w-24 h-24 object-cover rounded-md"
							onerror="this.src='/assets/product-placeholder.png'"
						/>
					</div>

					<!-- Product Info and Rating -->
					<div class="flex-1">
						<h3 class="text-lg font-semibold text-gray-900 mb-2">
							{{ productRating.product?.title || 'Product #' + productRating.productId }}
						</h3>
						<p class="text-sm text-gray-600 mb-4 line-clamp-2">
							{{ productRating.product?.shortDescription || '' }}
						</p>

						<!-- Star Rating -->
						<div class="flex items-center gap-2 mb-4">
							<div class="flex items-center gap-1">
								<button
									*ngFor="let star of [1, 2, 3, 4, 5]"
									type="button"
									class="star-button"
									[class.text-yellow-400]="star <= productRating.rating"
									[class.text-gray-300]="star > productRating.rating"
									[class.cursor-pointer]="!productRating.submitted"
									[class.cursor-not-allowed]="productRating.submitted"
									[disabled]="productRating.submitted || loading"
									(click)="setRating(productRating.productId, star)"
									(mouseenter)="
										!productRating.submitted && !loading
											? setRating(productRating.productId, star)
											: null
									"
								>
									<i
										class="pi text-2xl transition-colors"
										[ngClass]="
											star <= productRating.rating
												? 'pi-star-fill'
												: 'pi-star'
										"
									></i>
								</button>
							</div>
							<span
								class="text-sm text-gray-600 ml-2"
								*ngIf="productRating.rating > 0"
							>
								{{ productRating.rating }}/5
							</span>
							<span
								class="text-sm text-green-600 ml-2 flex items-center gap-1"
								*ngIf="productRating.submitted"
							>
								<i class="pi pi-check-circle"></i>
								Rated
							</span>
						</div>

						<!-- Submit Button -->
						<button
							*ngIf="!productRating.submitted"
							type="button"
							pButton
							label="Submit Rating"
							icon="pi pi-check"
							size="small"
							[disabled]="productRating.rating === 0 || loading"
							(click)="submitRating(productRating.productId)"
							class="p-button-sm"
						></button>
					</div>
				</div>
			</div>
		</div>

		<div *ngIf="productRatings.length === 0" class="text-center py-8">
			<p class="text-gray-500">No products found in this order.</p>
		</div>
	</div>

	<ng-template pTemplate="footer">
		<div class="flex justify-end">
			<p-button
				label="Close"
				icon="pi pi-times"
				severity="secondary"
				[outlined]="true"
				(click)="closeDialog()"
			></p-button>
		</div>
	</ng-template>
</p-dialog>
