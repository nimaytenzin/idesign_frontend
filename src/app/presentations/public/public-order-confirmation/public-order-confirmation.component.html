<div class="min-h-screen bg-slate-50 py-12">
	<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
		<div class="text-center mb-8">
			<div class="inline-flex items-center justify-center w-16 h-16 rounded-full mb-4"
			
			>
				
			</div>
			<h1 class="text-3xl font-bold text-slate-900 mb-2">
				
			</h1>
			
		</div>

		<div class="bg-white rounded-lg border border-slate-200 p-8 mb-8">
			<div class="space-y-4">
				<div class="flex justify-between items-center pb-4 border-b border-slate-200">
					<span class="text-slate-600">Order Number:</span>
					<span class="text-lg font-semibold text-slate-900">{{ orderNumber || order?.orderNumber || 'N/A' }}</span>
				</div>

				

				<div *ngIf="order" class="space-y-2 pt-4">
					<!-- Voucher Code Display -->
					<div *ngIf="order.voucherCode" class="mb-3 p-3 bg-teal-50 border border-teal-200 rounded-lg">
						<div class="flex items-center gap-2 mb-1">
							<i class="pi pi-tag text-teal-600"></i>
							<span class="text-sm font-semibold text-teal-900">Voucher Code Applied</span>
						</div>
						
					</div>

	
			</div>
		</div>

		<div class="flex flex-col sm:flex-row gap-4 justify-center">
			<!-- <button
				*ngIf="order && order.paymentStatus === PaymentStatus.PENDING && order.paymentMethod === 'ZPSS'"
				type="button"
				class="inline-flex items-center justify-center px-4 py-2 bg-teal-500 text-white rounded-lg hover:bg-teal-600 text-sm font-medium transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500"
				(click)="goToPayment()"
			>
				<i class="pi pi-credit-card mr-2"></i>
				Pay Now
			</button> -->
			<button
				*ngIf="order && order.orderItems && order.orderItems.length > 0"
				type="button"
				class="inline-flex items-center justify-center px-4 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 text-sm font-medium transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500"
				(click)="openRatingDialog()"
			>
				<i class="pi pi-star mr-2"></i>
				Rate Products
			</button>
			<button
				type="button"
				class="inline-flex items-center justify-center px-4 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 text-sm font-medium transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500"
				(click)="goToProducts()"
			>
				<i class="pi pi-shopping-bag mr-2"></i>
				Continue Shopping
			</button>
			<button
				type="button"
				class="inline-flex items-center justify-center px-4 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 text-sm font-medium transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500"
				(click)="goToHome()"
			>
				<i class="pi pi-home mr-2"></i>
				Go to Home
			</button>
		</div>
	</div>

	<!-- Product Rating Dialog -->
	<app-product-rating-dialog
		[(visible)]="ratingDialogVisible"
		[orderItems]="order?.orderItems || []"
	></app-product-rating-dialog>
</div>
