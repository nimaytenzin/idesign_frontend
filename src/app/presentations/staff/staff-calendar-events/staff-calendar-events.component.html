<div class="h-full flex flex-col">
	<p-toast></p-toast>
	<div *ngIf="loading" class="flex items-center justify-center h-full min-h-[400px]">
		<p-progressSpinner></p-progressSpinner>
	</div>
	
	<div *ngIf="!loading" class="h-full p-3 md:p-4">
		<full-calendar
			#fullcalendar
			[options]="calendarOptions"
		></full-calendar>
	</div>
</div>

<!-- Event Details Dialog -->
<p-dialog
	[(visible)]="showEventDialog"
	header="Event Details"
	[modal]="true"
	[style]="{ width: '500px' }"
	[closable]="true"
	[dismissableMask]="true"
>
	<div *ngIf="eventDetails" class="space-y-4">
		<div>
			<h3 class="text-lg font-semibold text-gray-900 mb-2">
				{{ eventDetails.title }}
			</h3>
		</div>

		<div class="space-y-3">
			<div>
				<label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">
					Start Date
				</label>
				<p class="text-sm text-gray-900">
					{{ formatDate(eventDetails.start) }}
				</p>
			</div>

			<div *ngIf="eventDetails.end">
				<label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">
					End Date
				</label>
				<p class="text-sm text-gray-900">
					{{ formatDate(eventDetails.end) }}
				</p>
			</div>

			<div *ngIf="eventDetails.extendedProps?.location">
				<label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">
					Location
				</label>
				<p class="text-sm text-gray-900">
					{{ eventDetails.extendedProps?.location }}
				</p>
			</div>

			<div *ngIf="eventDetails.extendedProps?.description">
				<label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">
					Description
				</label>
				<p class="text-sm text-gray-700 whitespace-pre-wrap">
					{{ eventDetails.extendedProps?.description }}
				</p>
			</div>

			<div *ngIf="eventDetails.createdBy">
				<label class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1">
					Created By
				</label>
				<p class="text-sm text-gray-900">
					{{ eventDetails.createdBy.name }}
				</p>
			</div>
		</div>
	</div>

	<ng-template pTemplate="footer">
		<p-button
			label="Close"
			icon="pi pi-times"
			severity="secondary"
			[outlined]="true"
			(onClick)="closeEventDialog()"
		></p-button>
	</ng-template>
</p-dialog>
