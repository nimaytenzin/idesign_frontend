<div class="p-6">
	<p-toast></p-toast>

	<div *ngIf="employee" class="space-y-6">
		<!-- Employee Info -->
		<div class="p-4 bg-gray-50 dark:bg-gray-800 rounded-lg">
			<p class="text-sm text-gray-600 dark:text-gray-400 mb-1">Resetting password for:</p>
			<p class="text-lg font-semibold text-gray-800 dark:text-white/90">{{ employee.name }}</p>
			<p class="text-sm text-gray-600 dark:text-gray-400">{{ employee.emailAddress }}</p>
		</div>

		<form (ngSubmit)="resetPassword()" class="space-y-4">
			<!-- New Password -->
			<div>
				<label
					for="newPassword"
					class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
				>
					New Password <span class="text-red-500">*</span>
				</label>
				<p-password
					id="newPassword"
					[(ngModel)]="newPassword"
					name="newPassword"
					placeholder="Enter new password (min 6 characters)"
					[feedback]="true"
					[class.ng-invalid]="submitted && (!newPassword || newPassword.length < 6)"
					styleClass="w-full"
					[inputStyleClass]="'w-full'"
				></p-password>
				<small class="p-error block mt-1" *ngIf="submitted && (!newPassword || newPassword.length < 6)"
					>Password must be at least 6 characters long</small
				>
			</div>

			<!-- Confirm Password -->
			<div>
				<label
					for="confirmPassword"
					class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
				>
					Confirm Password <span class="text-red-500">*</span>
				</label>
				<p-password
					id="confirmPassword"
					[(ngModel)]="confirmPassword"
					name="confirmPassword"
					placeholder="Confirm new password"
					[feedback]="false"
					[class.ng-invalid]="submitted && newPassword !== confirmPassword"
					styleClass="w-full"
					[inputStyleClass]="'w-full'"
				></p-password>
				<small class="p-error block mt-1" *ngIf="submitted && newPassword !== confirmPassword"
					>Passwords do not match</small
				>
			</div>

			<!-- Form Actions -->
			<div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
				<p-button
					label="Cancel"
					icon="pi pi-times"
					severity="secondary"
					[outlined]="true"
					(onClick)="cancel()"
					[disabled]="loading"
				></p-button>
				<p-button
					label="Reset Password"
					icon="pi pi-key"
					severity="info"
					type="submit"
					[loading]="loading"
				></p-button>
			</div>
		</form>
	</div>
</div>
