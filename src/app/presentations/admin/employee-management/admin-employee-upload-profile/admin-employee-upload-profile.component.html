<div class="p-6">
	<p-toast></p-toast>

	<div *ngIf="employee" class="space-y-6">
		<!-- Employee Info -->
		<div class="p-4 bg-gray-50 dark:bg-gray-800 rounded-lg">
			<p class="text-sm text-gray-600 dark:text-gray-400 mb-1">Uploading profile picture for:</p>
			<p class="text-lg font-semibold text-gray-800 dark:text-white/90">{{ employee.name }}</p>
			<p class="text-sm text-gray-600 dark:text-gray-400">{{ employee.emailAddress }}</p>
		</div>

		<!-- Current Profile Picture -->
		<div *ngIf="!previewUrl">
			<label class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300">
				Current Profile Picture
			</label>
			<div class="flex items-center gap-4">
				<p-avatar
					shape="circle"
					size="xlarge"
					[image]="getCurrentProfileImageUrl()"
					[label]="!getCurrentProfileImageUrl() ? getEmployeeInitial() : undefined"
					styleClass="bg-teal-100 text-teal-700"
				></p-avatar>
			</div>
		</div>

		<!-- Upload Section -->
		<form (ngSubmit)="uploadProfilePicture()" class="space-y-4">
			<!-- File Upload -->
			<div>
				<label
					class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
				>
					Select Profile Picture <span class="text-red-500">*</span>
				</label>
				<p-fileupload
					mode="basic"
					name="profilePicture"
					accept="image/jpeg,image/jpg,image/png,image/gif,image/webp"
					[maxFileSize]="5000000"
					[auto]="false"
					(onSelect)="onFileSelect($event)"
					chooseLabel="Choose Image"
					styleClass="w-full"
				></p-fileupload>
				<small class="text-gray-500 dark:text-gray-400 block mt-2">
					Accepted formats: JPG, JPEG, PNG, GIF, WEBP (Max size: 5MB)
				</small>
				<small class="p-error block mt-1" *ngIf="submitted && !selectedFile"
					>Please select an image file to upload</small
				>
			</div>

			<!-- Preview Section -->
			<div *ngIf="previewUrl || selectedFile" class="space-y-3">
				<label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
					Preview
				</label>
				<div class="flex items-center gap-4 p-4 bg-gray-50 dark:bg-gray-800 rounded-lg">
					<p-avatar
						shape="circle"
						size="xlarge"
						[image]="previewUrl"
						[label]="!previewUrl ? getEmployeeInitial() : undefined"
						styleClass="bg-teal-100 text-teal-700"
					></p-avatar>
					<div class="flex-1">
						<p class="text-sm font-medium text-gray-800 dark:text-white/90">
							{{ selectedFile?.name }}
						</p>
						<p class="text-xs text-gray-500 dark:text-gray-400">
							{{ selectedFile ? (selectedFile.size / 1024 / 1024).toFixed(2) + ' MB' : '' }}
						</p>
					</div>
					<p-button
						icon="pi pi-times"
						severity="danger"
						[text]="true"
						[rounded]="true"
						(onClick)="removeSelectedFile()"
						[disabled]="loading"
						pTooltip="Remove"
					></p-button>
				</div>
			</div>

			<!-- Form Actions -->
			<div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
				<p-button
					label="Cancel"
					icon="pi pi-times"
					severity="secondary"
					[outlined]="true"
					(onClick)="cancel()"
					[disabled]="loading"
				></p-button>
				<p-button
					label="Upload Picture"
					icon="pi pi-upload"
					severity="info"
					type="submit"
					[loading]="loading"
					[disabled]="!selectedFile"
				></p-button>
			</div>
		</form>
	</div>
</div>
