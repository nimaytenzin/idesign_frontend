<div class="p-6">
	<p-toast></p-toast>

	<form (ngSubmit)="saveEmployee()" class="space-y-6">
		<!-- Basic Information Section -->
		<div class="space-y-4">
			<h3 class="text-lg font-semibold text-gray-800 dark:text-white/90 mb-4">
				Basic Information
			</h3>

			<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
				<!-- Name -->
				<div>
					<label
						for="name"
						class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
					>
						Full Name <span class="text-red-500">*</span>
					</label>
					<input
						id="name"
						type="text"
						pInputText
						[(ngModel)]="name"
						name="name"
						placeholder="Enter full name"
						class="w-full"
						[class.ng-invalid]="submitted && !name"
						required
					/>
					<small class="p-error block mt-1" *ngIf="submitted && !name"
						>Name is required</small
					>
				</div>

				<!-- CID -->
				<div>
					<label
						for="cid"
						class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
					>
						Citizen ID (CID) <span class="text-red-500">*</span>
					</label>
					<input
						id="cid"
						type="text"
						pInputText
						[(ngModel)]="cid"
						name="cid"
						placeholder="Enter CID"
						class="w-full"
						[class.ng-invalid]="submitted && !cid"
						required
					/>
					<small class="p-error block mt-1" *ngIf="submitted && !cid"
						>CID is required</small
					>
				</div>

				<!-- Email -->
				<div>
					<label
						for="emailAddress"
						class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
					>
						Email Address <span class="text-red-500">*</span>
					</label>
					<input
						id="emailAddress"
						type="email"
						pInputText
						[(ngModel)]="emailAddress"
						name="emailAddress"
						placeholder="Enter email address"
						class="w-full"
						[class.ng-invalid]="submitted && !emailAddress"
						required
					/>
					<small class="p-error block mt-1" *ngIf="submitted && !emailAddress"
						>Email is required</small
					>
				</div>

				<!-- Phone Number -->
				<div>
					<label
						for="phoneNumber"
						class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
					>
						Phone Number
					</label>
					<input
						id="phoneNumber"
						type="tel"
						pInputText
						[(ngModel)]="phoneNumber"
						name="phoneNumber"
						placeholder="Enter phone number"
						class="w-full"
					/>
				</div>

				<!-- Password (only for new employees) -->
				<div *ngIf="!isEditMode">
					<label
						for="password"
						class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
					>
						Password <span class="text-red-500">*</span>
					</label>
					<p-password
						id="password"
						[(ngModel)]="password"
						name="password"
						placeholder="Enter password (min 6 characters)"
						[feedback]="false"
						[class.ng-invalid]="submitted && !password"
						styleClass="w-full"
						[inputStyleClass]="'w-full'"
					></p-password>
					<small class="p-error block mt-1" *ngIf="submitted && !password"
						>Password is required</small
					>
					<small class="text-gray-500 dark:text-gray-400">Minimum 6 characters</small>
				</div>
			</div>
		</div>

		<!-- Employment Information Section -->
		<div class="space-y-4">
			<h3 class="text-lg font-semibold text-gray-800 dark:text-white/90 mb-4">
				Employment Information
			</h3>

			<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
				<!-- Department -->
				<div>
					<label
						for="department"
						class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
					>
						Department
					</label>
					<input
						id="department"
						type="text"
						pInputText
						[(ngModel)]="department"
						name="department"
						placeholder="Enter department"
						class="w-full"
					/>
				</div>

				<!-- Position -->
				<div>
					<label
						for="position"
						class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
					>
						Position
					</label>
					<input
						id="position"
						type="text"
						pInputText
						[(ngModel)]="position"
						name="position"
						placeholder="Enter job position"
						class="w-full"
					/>
				</div>

				<!-- Hire Date -->
				<div>
					<label
						for="hireDate"
						class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
					>
						Hire Date
					</label>
					<p-calendar
						id="hireDate"
						[(ngModel)]="hireDate"
						name="hireDate"
						dateFormat="yy-mm-dd"
						[showIcon]="true"
						styleClass="w-full"
					></p-calendar>
				</div>

				<!-- Employee Status (only for edit mode) -->
				<div *ngIf="isEditMode">
					<label
						for="employeeStatus"
						class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
					>
						Employee Status
					</label>
					<p-dropdown
						id="employeeStatus"
						[options]="statusOptions"
						[(ngModel)]="employeeStatus"
						name="employeeStatus"
						optionLabel="label"
						optionValue="value"
						styleClass="w-full"
					></p-dropdown>
				</div>

				<!-- Termination Date (only for edit mode) -->
				<div *ngIf="isEditMode">
					<label
						for="terminationDate"
						class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
					>
						Termination Date
					</label>
					<p-calendar
						id="terminationDate"
						[(ngModel)]="terminationDate"
						name="terminationDate"
						dateFormat="yy-mm-dd"
						[showIcon]="true"
						styleClass="w-full"
					></p-calendar>
					<small class="text-gray-500 dark:text-gray-400">Set when employee status is TERMINATED</small>
				</div>
			</div>
		</div>

		<!-- Personal Information Section -->
		<div class="space-y-4">
			<h3 class="text-lg font-semibold text-gray-800 dark:text-white/90 mb-4">
				Personal Information
			</h3>

			<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
				<!-- Date of Birth -->
				<div>
					<label
						for="dateOfBirth"
						class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
					>
						Date of Birth
					</label>
					<p-calendar
						id="dateOfBirth"
						[(ngModel)]="dateOfBirth"
						name="dateOfBirth"
						dateFormat="yy-mm-dd"
						[showIcon]="true"
						styleClass="w-full"
					></p-calendar>
				</div>

				<!-- Address -->
				<div class="md:col-span-2">
					<label
						for="address"
						class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
					>
						Address
					</label>
					<textarea
						id="address"
						pInputTextarea
						[(ngModel)]="address"
						name="address"
						placeholder="Enter address"
						rows="3"
						class="w-full"
					></textarea>
				</div>

				<!-- Profile Image URL -->
				<div class="md:col-span-2">
					<label
						for="profileImageUrl"
						class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
					>
						Profile Image URL
					</label>
					<input
						id="profileImageUrl"
						type="url"
						pInputText
						[(ngModel)]="profileImageUrl"
						name="profileImageUrl"
						placeholder="https://example.com/uploads/profiles/image.jpg"
						class="w-full"
					/>
					<small class="text-gray-500 dark:text-gray-400">URL or path to staff member's profile image</small>
				</div>
			</div>
		</div>

		<!-- Form Actions -->
		<div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
			<p-button
				label="Cancel"
				icon="pi pi-times"
				severity="secondary"
				[outlined]="true"
				(onClick)="cancel()"
				[disabled]="loading"
			></p-button>
			<p-button
				[label]="isEditMode ? 'Update Employee' : 'Create Employee'"
				icon="pi pi-check"
				severity="success"
				type="submit"
				[loading]="loading"
			></p-button>
		</div>
	</form>
</div>
