<div class="min-h-screen bg-gray-50 p-4 md:p-6">
	<div class="max-w-[95vw] mx-auto">
		<p-toast></p-toast>
		<p-confirmDialog></p-confirmDialog>

		<!-- Header -->
		<div class="flex items-center justify-between mb-6">
			<div>
				<h1 class="text-2xl font-semibold text-gray-900">Calendar</h1>
				<p class="text-sm text-gray-500 mt-1">Manage events and schedules</p>
			</div>
			<div class="flex items-center gap-2">
				<p-button
					label="New Recurring Event"
					icon="pi pi-refresh"
					size="small"
					severity="secondary"
					[outlined]="true"
					(onClick)="openRecurringEventDialog()"
				></p-button>
				<p-button
					label="New Event"
					icon="pi pi-plus"
					size="small"
					(onClick)="openNewEventDialog()"
				></p-button>
			</div>
		</div>

		<!-- Calendar Container -->
		<div class="bg-white rounded-lg border border-gray-200 shadow-sm p-4 md:p-6">
			<full-calendar
				#fullcalendar
				[options]="calendarOptions"
				
			></full-calendar>
		</div>
	</div>
</div>
