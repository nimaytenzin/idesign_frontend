<div class="p-6" *ngIf="document">
	<form [formGroup]="documentForm" (ngSubmit)="saveDocument()">
		<div class="mb-5">
			<label
				for="documentTitle"
				class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
			>
				Document Title <span class="text-red-500">*</span>
			</label>
			<input
				id="documentTitle"
				type="text"
				pInputText
				formControlName="documentTitle"
				placeholder="Enter document title"
				class="w-full"
				[class.ng-invalid]="isFieldInvalid('documentTitle')"
			/>
			<small class="p-error block mt-1" *ngIf="isFieldInvalid('documentTitle')">
				{{ getFieldError('documentTitle') }}
			</small>
		</div>

		<!-- Display current file info (read-only) -->
		<div class="mb-5">
			<label class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300">
				Current File
			</label>
			<div class="p-3 bg-gray-50 dark:bg-gray-800 rounded border border-gray-200 dark:border-gray-700">
				<div class="flex items-center gap-2">
					<i class="pi pi-file text-gray-500"></i>
					<span class="text-sm text-gray-700 dark:text-gray-300">{{ document.fileName }}</span>
				</div>
			</div>
			<small class="text-gray-500 dark:text-gray-400 block mt-1">
				File cannot be changed. To upload a new file, create a new document.
			</small>
		</div>
	</form>
</div>

<div class="flex justify-end gap-2 px-6 pb-6">
	<p-button
		label="Cancel"
		icon="pi pi-times"
		[outlined]="true"
		severity="secondary"
		(onClick)="close()"
		[disabled]="loading"
	></p-button>
	<p-button
		label="Update"
		icon="pi pi-check"
		(onClick)="saveDocument()"
		[loading]="loading"
	></p-button>
</div>

<p-toast></p-toast>
