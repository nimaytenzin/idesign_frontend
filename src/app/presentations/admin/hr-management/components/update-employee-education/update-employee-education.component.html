<div class="flex flex-col gap-4" *ngIf="education">
	<div class="flex flex-col gap-2">
		<label for="level" class="text-sm font-medium text-gray-700">
			Education Level
		</label>
		<p-dropdown
			id="level"
			[options]="levelOptions"
			optionLabel="label"
			optionValue="value"
			[(ngModel)]="updateData.level"
			placeholder="Select education level"
			styleClass="w-full"
		></p-dropdown>
	</div>

	<div class="flex flex-col gap-2">
		<label for="courseTitle" class="text-sm font-medium text-gray-700">
			Course Title
		</label>
		<input
			id="courseTitle"
			type="text"
			pInputText
			[(ngModel)]="updateData.courseTitle"
			placeholder="Enter course title"
			class="w-full"
		/>
	</div>

	<div class="flex flex-col gap-2">
		<label for="institute" class="text-sm font-medium text-gray-700">
			Institute
		</label>
		<input
			id="institute"
			type="text"
			pInputText
			[(ngModel)]="updateData.institute"
			placeholder="Enter institute name"
			class="w-full"
		/>
	</div>

	<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
		<div class="flex flex-col gap-2">
			<label for="startDate" class="text-sm font-medium text-gray-700">
				Start Date
			</label>
			<p-calendar
				id="startDate"
				[(ngModel)]="updateData.startDate"
				[showIcon]="true"
				dateFormat="yy-mm-dd"
				[showButtonBar]="true"
				styleClass="w-full"
				appendTo="body"
				placeholder="Select start date"
			></p-calendar>
		</div>

		<div class="flex flex-col gap-2">
			<label for="endDate" class="text-sm font-medium text-gray-700">
				End Date
			</label>
			<p-calendar
				id="endDate"
				[(ngModel)]="updateData.endDate"
				[showIcon]="true"
				dateFormat="yy-mm-dd"
				[showButtonBar]="true"
				styleClass="w-full"
				appendTo="body"
				placeholder="Select end date"
			></p-calendar>
		</div>
	</div>

	<div class="flex flex-col gap-2">
		<label for="status" class="text-sm font-medium text-gray-700">
			Status
		</label>
		<p-dropdown
			id="status"
			[options]="statusOptions"
			optionLabel="label"
			optionValue="value"
			[(ngModel)]="updateData.status"
			placeholder="Select status"
			styleClass="w-full"
		></p-dropdown>
	</div>
</div>

<div class="flex justify-end gap-2 mt-6">
	<p-button
		label="Cancel"
		icon="pi pi-times"
		[text]="true"
		(onClick)="close()"
		[disabled]="loading"
	></p-button>
	<p-button
		label="Update Education"
		icon="pi pi-check"
		severity="success"
		(onClick)="saveEducation()"
		[loading]="loading"
	></p-button>
</div>

<p-toast></p-toast>
