<div class="p-6">
	<form [formGroup]="locationForm" (ngSubmit)="saveLocation()">
		<div class="mb-5">
			<label
				for="name"
				class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
			>
				Location Name <span class="text-red-500">*</span>
			</label>
			<input
				id="name"
				type="text"
				pInputText
				formControlName="name"
				placeholder="Enter location name"
				class="w-full"
				[class.ng-invalid]="isFieldInvalid('name')"
			/>
			<small class="p-error block mt-1" *ngIf="isFieldInvalid('name')">
				{{ getFieldError('name') }}
			</small>
		</div>

		<div class="mb-5">
			<label
				for="type"
				class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
			>
				Location Type <span class="text-red-500">*</span>
			</label>
			<p-dropdown
				id="type"
				formControlName="type"
				[options]="locationTypes"
				optionLabel="label"
				optionValue="value"
				placeholder="Select location type"
				class="w-full"
				[class.ng-invalid]="isFieldInvalid('type')"
			></p-dropdown>
			<small class="p-error block mt-1" *ngIf="isFieldInvalid('type')">
				{{ getFieldError('type') }}
			</small>
		</div>
	</form>
</div>

<div class="flex justify-end gap-2 px-6 pb-6">
	<p-button
		label="Cancel"
		icon="pi pi-times"
		[outlined]="true"
		severity="secondary"
		(onClick)="close()"
	></p-button>
	<p-button
		label="Update"
		icon="pi pi-check"
		(onClick)="saveLocation()"
		[loading]="loading"
	></p-button>
</div>

<p-toast></p-toast>
