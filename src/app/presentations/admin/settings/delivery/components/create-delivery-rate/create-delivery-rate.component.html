<div class="p-6">
	<form [formGroup]="rateForm" (ngSubmit)="saveRate()">
		<div class="mb-5">
			<label
				for="deliveryLocationId"
				class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
			>
				Location <span class="text-red-500">*</span>
			</label>
			<div *ngIf="loadingLocations" class="flex items-center gap-2 p-3">
				<p-progressSpinner [style]="{'width': '20px', 'height': '20px'}"></p-progressSpinner>
				<span class="text-sm text-gray-500">Loading locations...</span>
			</div>
			<p-dropdown
				*ngIf="!loadingLocations"
				id="deliveryLocationId"
				formControlName="deliveryLocationId"
				[options]="locations"
				optionLabel="label"
				optionValue="value"
				placeholder="Select a location"
				class="w-full"
				[class.ng-invalid]="isFieldInvalid('deliveryLocationId')"
				[disabled]="locations.length === 0"
			></p-dropdown>
			<small class="p-error block mt-1" *ngIf="isFieldInvalid('deliveryLocationId')">
				{{ getFieldError('deliveryLocationId') }}
			</small>
			<small class="text-gray-500 dark:text-gray-400 block mt-1" *ngIf="!loadingLocations && locations.length === 0">
				No locations found. Please create a location first.
			</small>
		</div>

		<div class="mb-5">
			<label
				for="transportMode"
				class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
			>
				Transport Mode <span class="text-red-500">*</span>
			</label>
			<p-dropdown
				id="transportMode"
				formControlName="transportMode"
				[options]="transportModes"
				optionLabel="label"
				optionValue="value"
				placeholder="Select transport mode"
				class="w-full"
				[class.ng-invalid]="isFieldInvalid('transportMode')"
			></p-dropdown>
			<small class="p-error block mt-1" *ngIf="isFieldInvalid('transportMode')">
				{{ getFieldError('transportMode') }}
			</small>
		</div>

		<div class="mb-5">
			<label
				for="rate"
				class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
			>
				Rate (Nu.) <span class="text-red-500">*</span>
			</label>
			<p-inputNumber
				id="rate"
				formControlName="rate"
				[showButtons]="true"
				[min]="0"
				[step]="10"
				[prefix]="'Nu. '"
				mode="decimal"
				[useGrouping]="false"
				[class.ng-invalid]="isFieldInvalid('rate')"
				class="w-full"
			></p-inputNumber>
			<small class="p-error block mt-1" *ngIf="isFieldInvalid('rate')">
				{{ getFieldError('rate') }}
			</small>
		</div>
	</form>
</div>

<div class="flex justify-end gap-2 px-6 pb-6">
	<p-button
		label="Cancel"
		icon="pi pi-times"
		[outlined]="true"
		severity="secondary"
		(onClick)="close()"
	></p-button>
	<p-button
		label="Create"
		icon="pi pi-check"
		(onClick)="saveRate()"
		[loading]="loading"
	></p-button>
</div>

<p-toast></p-toast>
