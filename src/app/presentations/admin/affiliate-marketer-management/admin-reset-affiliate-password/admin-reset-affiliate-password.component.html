<div class="p-6">
	<p-toast></p-toast>

	<div *ngIf="affiliate" class="space-y-6">
		<!-- Affiliate Info -->
		<div class="bg-gray-50 dark:bg-gray-800 rounded-lg p-4">
			<h4 class="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
				Affiliate Marketer
			</h4>
			<p class="text-sm text-gray-600 dark:text-gray-400">
				<strong>Name:</strong> {{ affiliate.name }}
			</p>
			<p class="text-sm text-gray-600 dark:text-gray-400">
				<strong>Email:</strong> {{ affiliate.email }}
			</p>
		</div>

		<!-- Password Form -->
		<form (ngSubmit)="resetPassword()" class="space-y-4">
			<!-- New Password -->
			<div>
				<label
					for="newPassword"
					class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
				>
					New Password <span class="text-red-500">*</span>
				</label>
				<p-password
					id="newPassword"
					[(ngModel)]="newPassword"
					name="newPassword"
					placeholder="Enter new password (min 6 characters)"
					[feedback]="true"
					[class.ng-invalid]="submitted && (!newPassword || newPassword.length < 6)"
					styleClass="w-full"
					[inputStyleClass]="'w-full'"
				></p-password>
				<small class="p-error block mt-1" *ngIf="submitted && (!newPassword || newPassword.length < 6)"
					>Password must be at least 6 characters long</small
				>
			</div>

			<!-- Confirm Password -->
			<div>
				<label
					for="confirmPassword"
					class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
				>
					Confirm Password <span class="text-red-500">*</span>
				</label>
				<p-password
					id="confirmPassword"
					[(ngModel)]="confirmPassword"
					name="confirmPassword"
					placeholder="Confirm new password"
					[feedback]="false"
					[class.ng-invalid]="submitted && newPassword !== confirmPassword"
					styleClass="w-full"
					[inputStyleClass]="'w-full'"
				></p-password>
				<small class="p-error block mt-1" *ngIf="submitted && newPassword !== confirmPassword"
					>Passwords do not match</small
				>
			</div>

			<!-- Form Actions -->
			<div class="flex justify-end gap-3 pt-4">
				<p-button
					label="Cancel"
					severity="secondary"
					[outlined]="true"
					(onClick)="cancel()"
					[disabled]="loading"
				></p-button>
				<p-button
					label="Reset Password"
					icon="pi pi-key"
					(onClick)="resetPassword()"
					[loading]="loading"
					[disabled]="loading"
				></p-button>
			</div>
		</form>
	</div>
</div>
