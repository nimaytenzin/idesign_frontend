<div class="p-6">
	<form [formGroup]="subcategoryForm" (ngSubmit)="saveSubCategory()">
		<div class="mb-5">
			<label
				for="subCategoryName"
				class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
			>
				Name <span class="text-red-500">*</span>
			</label>
			<input
				id="subCategoryName"
				type="text"
				pInputText
				formControlName="name"
				placeholder="Enter subcategory name"
				class="w-full"
				[class.ng-invalid]="isFieldInvalid('name')"
			/>
			<small class="p-error block mt-1" *ngIf="isFieldInvalid('name')">
				{{ getFieldError('name') }}
			</small>
		</div>

		<div class="mb-5">
			<label
				for="subCategoryParent"
				class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
			>
				Parent Category <span class="text-red-500">*</span>
			</label>
			<p-dropdown
				id="subCategoryParent"
				[options]="categoriesList"
				optionLabel="name"
				optionValue="id"
				formControlName="productCategoryId"
				placeholder="Select parent category"
				styleClass="w-full"
				[class.ng-invalid]="isFieldInvalid('productCategoryId')"
			></p-dropdown>
			<small class="p-error block mt-1" *ngIf="isFieldInvalid('productCategoryId')">
				{{ getFieldError('productCategoryId') }}
			</small>
		</div>

		<div class="mb-5">
			<label
				for="subCategoryDescription"
				class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
				>Description</label
			>
			<textarea
				id="subCategoryDescription"
				pInputTextarea
				formControlName="description"
				placeholder="Enter subcategory description (optional)"
				rows="4"
				class="w-full"
			></textarea>
		</div>

		<div class="mb-5">
			<label class="block text-sm font-medium text-gray-700 mb-2 dark:text-gray-300"
				>Status</label
			>
			<div class="flex items-center gap-3">
				<p-toggleswitch 
					name="isActive"
					formControlName="isActive"
				></p-toggleswitch>
				<span class="text-gray-700 dark:text-gray-300">{{
					subcategoryForm.get('isActive')?.value === true ? "Active" : "Inactive"
				}}</span>
			</div>
		</div>
	</form>
</div>

<div class="flex justify-end gap-2 px-6 pb-6">
	<p-button
		label="Cancel"
		icon="pi pi-times"
		[outlined]="true"
		severity="secondary"
		(onClick)="close()"
	></p-button>
	<p-button
		label="Create"
		icon="pi pi-check"
		(onClick)="saveSubCategory()"
		[loading]="loading"
	></p-button>
</div>

<p-toast></p-toast>
