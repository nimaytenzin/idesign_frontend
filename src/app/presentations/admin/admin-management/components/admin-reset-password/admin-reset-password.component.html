<div class="flex flex-col gap-6" *ngIf="user">
	<div class="mb-4 p-3 bg-gray-50 rounded-lg">
		<p class="text-sm text-gray-600 mb-1">User:</p>
		<p class="font-semibold text-gray-900">{{ user.name }}</p>
		<p class="text-xs text-gray-500">{{ user.emailAddress }}</p>
	</div>

	<div class="flex flex-col gap-2">
		<label for="newPassword" class="text-sm font-medium text-gray-700">New Password <span class="text-red-500">*</span></label>
		<p-password
			id="newPassword"
			[(ngModel)]="newPassword"
			placeholder="Enter new password"
			[feedback]="true"
			[toggleMask]="true"
			styleClass="w-full"
			[class.ng-invalid]="submitted && (!newPassword || newPassword.length < 6)"
			[inputStyleClass]="'w-full'"
		></p-password>
		<small class="text-xs text-red-500 mt-1" *ngIf="submitted && (!newPassword || newPassword.length < 6)">
			Password must be at least 6 characters long
		</small>
	</div>

	<div class="flex flex-col gap-2">
		<label for="confirmPassword" class="text-sm font-medium text-gray-700">Confirm Password <span class="text-red-500">*</span></label>
		<p-password
			id="confirmPassword"
			[(ngModel)]="confirmPassword"
			placeholder="Confirm new password"
			[toggleMask]="true"
			styleClass="w-full"
			[class.ng-invalid]="submitted && newPassword !== confirmPassword"
			[inputStyleClass]="'w-full'"
		></p-password>
		<small class="text-xs text-red-500 mt-1" *ngIf="submitted && newPassword !== confirmPassword">
			Passwords do not match
		</small>
	</div>
</div>

<div class="flex justify-end gap-2 mt-4">
	<p-button
		label="Cancel"
		icon="pi pi-times"
		[text]="true"
		(onClick)="close()"
		[disabled]="loading"
	></p-button>
	<p-button
		label="Reset Password"
		icon="pi pi-check"
		severity="warn"
		(onClick)="resetPassword()"
		[loading]="loading"
	></p-button>
</div>

<p-toast></p-toast>
