<div class="p-6">
	<form (ngSubmit)="onSubmit()" class="space-y-6">
		<!-- Portfolio Name Field -->
		<div>
			<label
				for="name"
				class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300"
			>
				Portfolio Name <span class="text-red-500">*</span>
			</label>
			<input
				id="name"
				type="text"
				pInputText
				[(ngModel)]="name"
				name="name"
				required
				class="w-full"
				placeholder="Enter portfolio name (e.g., Operations, Printing, Maintenance)"
			/>
			<small class="text-gray-500 dark:text-gray-400 mt-1 block">
				Portfolio names must be unique
			</small>
		</div>

		<!-- Form Actions -->
		<div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
			<p-button
				label="Cancel"
				icon="pi pi-times"
				severity="secondary"
				(onClick)="onCancel()"
				[disabled]="loading"
			></p-button>
			<p-button
				[label]="isEditMode ? 'Update' : 'Create'"
				icon="pi pi-check"
				type="submit"
				[loading]="loading"
			></p-button>
		</div>
	</form>
</div>

<p-toast></p-toast>
