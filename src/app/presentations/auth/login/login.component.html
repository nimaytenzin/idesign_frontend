<!-- iDesign Login Page -->
<div
	class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8"
>
	<div class="max-w-md w-full space-y-8">
		<!-- Header -->
		<div class="text-center">
			<div class="flex justify-center mb-6">
				<div
					class="w-16 h-16 bg-teal-600 rounded-lg flex items-center justify-center"
				>
					<i class="pi pi-cog text-2xl text-white"></i>
				</div>
			</div>
			<h1 class="text-3xl font-bold text-gray-900 ">
				iDesign Admin
			</h1>
			<p class="mt-2 text-gray-600 ">
				3D Printing Management System
			</p>
		</div>

		<!-- Login Form -->
		<div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
			<form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-6">
				<!-- Username Field -->
				<div>
					<label for="username" class="input-label"> Username </label>
					<input
						id="username"
						type="text"
						formControlName="username"
						placeholder="Enter your username"
						class="input-field"
						[class.error]="hasFieldError('username')"
					/>
					<div
						*ngIf="hasFieldError('username')"
						class="mt-1 text-sm text-red-600 "
					>
						{{ getFieldError("username") }}
					</div>
				</div>

				<!-- Password Field -->
				<div>
					<label for="password" class="input-label"> Password </label>
					<input
						id="password"
						type="password"
						formControlName="password"
						placeholder="Enter your password"
						class="input-field"
						[class.error]="hasFieldError('password')"
					/>
					<div
						*ngIf="hasFieldError('password')"
						class="mt-1 text-sm text-red-600 "
					>
						{{ getFieldError("password") }}
					</div>
				</div>

				<!-- Remember Me -->
				<div class="flex items-center justify-between">
					<div class="flex items-center">
						<input
							id="remember-me"
							type="checkbox"
							class="h-4 w-4 text-teal-600 border-gray-300 rounded focus:ring-teal-500"
						/>
						<label
							for="remember-me"
							class="ml-2 text-sm text-gray-600 "
						>
							Remember me
						</label>
					</div>
					<a
						href="#"
						class="text-sm text-teal-600 hover:text-teal-700 "
					>
						Forgot password?
					</a>
				</div>

				<!-- Error Message -->
				<div
					*ngIf="errorMessage"
					class="p-3 bg-red-50 border border-red-200 rounded-md"
				>
					<div class="flex">
						<i class="pi pi-exclamation-triangle text-red-500 mr-2"></i>
						<span class="text-sm text-red-700 ">{{
							errorMessage
						}}</span>
					</div>
				</div>

				<!-- Submit Button -->
				<button
					type="submit"
					[disabled]="loginForm.invalid || isLoading"
					class="btn-primary w-full flex justify-center items-center"
				>
					<i *ngIf="isLoading" class="pi pi-spin pi-spinner mr-2"></i>
					<i *ngIf="!isLoading" class="pi pi-sign-in mr-2"></i>
					{{ isLoading ? "Signing in..." : "Sign in" }}
				</button>
			</form>

			<!-- Footer Links -->
			<div class="mt-6 text-center">
				<p class="text-sm text-gray-500 ">
					Not an admin?
					<a
						routerLink="/"
						class="text-teal-600 hover:text-teal-700 font-medium"
					>
						Visit our store
					</a>
				</p>
			</div>
		</div>

		<!-- Demo Credentials -->
		<div class="bg-teal-50 rounded-lg p-4 border border-teal-200">
			<h3 class="text-sm font-medium text-teal-800  mb-2">
				Demo Credentials
			</h3>
			<div class="text-sm text-teal-700  space-y-1">
				<p><strong>Username:</strong> admin</p>
				<p><strong>Password:</strong> admin123</p>
			</div>
		</div>
	</div>
</div>
